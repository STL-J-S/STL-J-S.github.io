  <main>
    <section class="card">
      <h1>Contact Me</h1>
      <p>Have a question or want to work together? Send me a direct email at 
        <a href="mailto:STL.JCompMan@://yahoo.com">E-Mail Me</a>
        <br></br><p></p>
        <p>Alternatively use the form below to open your email client.</p>
      </p>

      <form class="contact-form" action="mailto:cSTL.JCompMan@eyahoo.com" method="post" enctype="text/plain">
        <div>
          <label for="name">Name</label>
          <input type="text" id="name" name="Name" required placeholder="Your name">
        </div>

        <div>
          <label for="email">Your Email</label>
          <input type="email" id="email" name="Email" required placeholder="you@example.com">
        </div>

        <div>
          <label for="message">Message</label>
          <textarea id="message" name="Message" rows="5" required placeholder="Write your message here..."></textarea>
        </div>

        <button type="submit" class="btn">Send Email</button>
      </form>
    </section>
  </main>
